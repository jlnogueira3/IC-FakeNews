name: Feedback ponderado temporal - testes

on:
  push:
    branches:
      - feat/feedback-ponderado-temporal
  pull_request:
    paths:
      - 'code/feedback_ponderado_temporal/**'
      - '.github/workflows/feedback-ponderado-temporal.yml'

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: python -m pip install --upgrade pip numpy scipy pandas scikit-learn openpyxl pytest
      - name: Testes sinteticos sem dados privados
        run: python -m pytest code/feedback_ponderado_temporal/tests -q
